    <h1>Horizon Portals</h1>
    <p>A portal gave people almost no information until after they crossed into another world. I turned physical approach into an information architecture so someone could reach a confident yes or no before stepping through.</p>
    <h2>Contribution</h2>
    <p>A different discipline owned the portal&#39;s physical scale and pointing behavior. I owned what appeared, when it appeared, and what each distance needed to support an informed decision.</p>
    <h2>Evidence</h2>
    <p>The model shipped in Meta Horizon, was introduced at Meta Connect 2024, and set a metadata precedent for other travel surfaces. Engagement and retention improved, although the figures are not public.</p>
