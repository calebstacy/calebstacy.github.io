<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Ask the records</title>
<meta name="description" content="A live terminal onto the Netflix shelf-naming records: shelftool.py running on a real server, streamed into the page — deterministic commands for lanes, moves, and draft checks, and a Claude agent grounded in the same tools.">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/mark-favicon.svg">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--paper)}
.errbox{padding:var(--space-9,48px);font-family:var(--font-sans);max-width:640px;color:var(--muted-ink)}
.term-body{font-family:var(--font-mono);font-size:12.5px;line-height:1.7;color:var(--stage-ink)}
.term-stage{position:relative;height:clamp(420px,62vh,640px);background:#000}
.term-frame{display:block;width:100%;height:100%;border:0;background:#000}
.term-cover{height:100%;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:24px 28px;overflow-y:auto}
.term-connect{appearance:none;align-self:flex-start;margin-top:14px;border:1px solid var(--signal-stage);background:transparent;color:var(--signal-stage);font-family:var(--font-mono);font-size:12.5px;font-weight:700;padding:10px 18px;cursor:pointer}
.term-connect:hover{background:var(--signal-stage);color:var(--stage-deep)}
.term-connect:focus-visible{outline:2px solid var(--signal-stage);outline-offset:3px}
.term-chip{appearance:none;border:0;background:transparent;color:var(--stage-muted);font-family:var(--font-mono);font-size:9px;font-weight:700;padding:0;cursor:pointer;text-transform:none}
.term-chip:hover{color:var(--signal-stage)}
.term-a{color:var(--signal-stage);text-decoration:underline;text-underline-offset:2px}
.term-hint{color:var(--story-muted);font-family:var(--font-mono);font-size:11px;margin-top:12px}
</style>
</head><body><div id="root">
<noscript>This page frames a live terminal and needs JavaScript for the frame. The terminal itself is shelftool.py in this same directory — run it anywhere with uv. The underlying data lives in <a href="./shelves.json">shelves.json</a> and <a href="./moves.json">moves.json</a>; the derivation is in <a href="./index.html">the working paper</a>.</noscript>
</div>
